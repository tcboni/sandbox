<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Sandbox</title>

    <link
      rel="icon"
      type="image/svg+xml"
      href="data:image/svg+xml,%3Csvg%20xmlns%3D%22http%3A%2F%2Fwww.w3.org%2F2000%2Fsvg%22%20viewBox%3D%220%200%2032%2032%22%20fill%3D%22none%22%3E%3Cpath%20d%3D%22M10%206L3%2016L10%2026L22%206L29%2016L22%2026%22%20stroke%3D%22%237e9cb5%22%20stroke-width%3D%222.8%22%20stroke-linecap%3D%22round%22%20stroke-linejoin%3D%22round%22%2F%3E%3C%2Fsvg%3E"
    />
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.11.1/styles/atom-one-dark.min.css"
      integrity="sha512-Jk4AqjWsdSzSWCSuQTfYRIF84Rq/eV0G2+tu07byYwHcbTGfdmLrHjUSwvzp5HvbiqK4ibmNwdcG49Y5RGYPTg=="
      crossorigin="anonymous"
    />

      {
        "imports": {
          "highlight.js/": "https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.11.1/es/"
        },
        "integrity": {
          "https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.11.1/es/core.min.js": "sha512-GuVoeU19Vs7el8GKo3lq2ogzwCIRBuQDnSL0rtHD4KVq3EymKgG4Uj/SEbbggJ+o+ocAcwdbn8hPSgdVPKdPlQ==",

          "https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.11.1/es/languages/css.min.js": "sha512-AfBGlKM0Vd4ukBI4xW2+g3SUNYSE5cqr6HtzsDWkgfDOJXHHet9NbI7oHd5AdMA60GVdEkcSp4d+dG5lLbcgBQ==",

        }
      }
    </script>

    <style>
      *,
      *::before,
      *::after {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
      }

      :root {
        --bg-0: #0e0f10;
        --bg-1: #151719;
        --bg-2: #1c1f21;
        --bg-3: #26292c;
        --border: #2e3236;
        --text: #d5d9dd;
        --muted: #848a91;
        --accent: #7e9cb5;
        --accent-hi: #93b1c9;
        --blue: #61afef;
        --yellow: #e5c07b;
        --cyan: #56b6c2;
        --red: #e06c75;

        --tab-h: 34px;
      }

      ::selection {
        background: rgba(126, 156, 181, 0.28);
      }

      body {
        font-family:
          -apple-system, BlinkMacSystemFont, "Segoe UI", system-ui, sans-serif;
        background: var(--bg-0);
        color: var(--text);
        height: 100vh;
        display: flex;
        flex-direction: column;
        overflow: hidden;
        font-size: 13px;
      }

      /* ─── Header ─────────────────────────────────────────────── */
      #header {
        background: var(--bg-1);
        border-bottom: 1px solid var(--border);
        display: flex;
        align-items: center;
        padding: 9px 14px;
        gap: 10px;
        flex-shrink: 0;
        position: relative;
      }

      .logo {
        display: flex;
        align-items: center;
        gap: 9px;
        text-decoration: none;
        flex-shrink: 0;
      }
      .logo-mark {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        flex-shrink: 0;
      }
      .logo-mark svg {
        display: block;
        width: 20px;
        height: 20px;
      }
      .logo-text {
        font-family: ui-serif, "Iowan Old Style", Georgia, "Times New Roman",
          serif;
        font-size: 16px;
        font-weight: 600;
        color: var(--text);
        letter-spacing: 0.2px;
        white-space: nowrap;
      }

      .header-right {
        margin-left: auto;
        display: flex;
        align-items: center;
        gap: 8px;
      }

      .btn {
        display: inline-flex;
        align-items: center;
        gap: 5px;
        padding: 5px 12px;
        border-radius: 6px;
        font-size: 12px;
        font-weight: 500;
        cursor: pointer;
        border: 1px solid transparent;
        transition:
          background 0.12s,
          border-color 0.12s,
          color 0.12s;
        outline: none;
        white-space: nowrap;
        user-select: none;
      }
      .btn svg {
        flex-shrink: 0;
      }
      .btn-primary {
        color: #10161b;
        background: var(--accent);
      }
      .btn-primary:hover {
        background: var(--accent-hi);
      }
      .btn-ghost {
        background: transparent;
        color: var(--muted);
        border-color: transparent;
        padding: 5px 9px;
      }
      .btn-ghost:hover {
        color: var(--text);
        background: var(--bg-3);
      }
      .btn-ghost.active {
        color: var(--accent-hi);
        background: rgba(126, 156, 181, 0.14);
      }

      /* ─── Main layout ─────────────────────────────────────────── */
      #main {
        flex: 1;
        display: flex;
        min-height: 0;
      }

      /* ─── Editors pane ────────────────────────────────────────── */
      #editors-pane {
        width: 40%;
        min-width: 160px;
        max-width: calc(100% - 160px);
        display: flex;
        flex-direction: column;
        flex-shrink: 0;
      }

      .editor-panel {
        display: flex;
        flex-direction: column;
        flex: 1 1 0;
        min-height: 50px;
        overflow: hidden;
      }

      .editor-tab,
      .preview-tab,
      .console-tab {
        height: var(--tab-h);
        background: var(--bg-1);
        border-bottom: 1px solid var(--border);
        display: flex;
        align-items: center;
        padding: 0 13px;
        gap: 8px;
        flex-shrink: 0;
        user-select: none;
      }

      .tab-dot {
        width: 7px;
        height: 7px;
        border-radius: 50%;
        flex-shrink: 0;
      }
      .tab-label {
        font-size: 11px;
        font-weight: 600;
        text-transform: uppercase;
        letter-spacing: 1.2px;
        color: var(--muted);
      }

      #html-panel .tab-dot {
        background: #e25d3c;
      }
      #css-panel .tab-dot {
        background: #4d9de8;
      }
      #js-panel .tab-dot {
        background: #ecc94b;
      }

      /* ─── Editor container ────────────────────────────────── */
      .editor-wrap {
        flex: 1;
        position: relative;
        overflow: hidden;
        min-height: 0;
      }
      .editor-wrap .code-editor {
        position: absolute;
        inset: 0;
        margin: 0;
        min-height: 100%;
        border: none;
        outline: none;
        background: var(--bg-0);
        color: var(--text);
        font-family:
          "SF Mono", "Cascadia Code", "Fira Code", Consolas, "Liberation Mono",
          monospace;
        font-size: 12.5px;
        line-height: 1.65;
        padding: 8px;
        white-space: pre-wrap;
        overflow-wrap: break-word;
        tab-size: 2;
        font-variant-ligatures: none;
        overflow: auto;
      }

      .editor-wrap .code-editor,
      .editor-wrap .code-editor * {
        font-style: normal !important;
        font-weight: 400 !important;
      }

      /* ─── Resize handles ──────────────────────────────────────── */
      .rh {
        background: var(--border);
        flex-shrink: 0;
        transition: background 0.15s;
        background-clip: content-box;
        position: relative;
        z-index: 5;
      }
      .rh:hover,
      .rh.dragging {
        background-color: var(--accent);
      }

      .rh-h {
        height: 8px;
        padding: 2px 0;
        margin: -2px 0;
        cursor: ns-resize;
      }

      .rh-v {
        width: 8px;
        padding: 0 2px;
        margin: 0 -2px;
        cursor: ew-resize;
      }

      /* ─── Preview pane ────────────────────────────────────────── */
      #preview-pane {
        flex: 1;
        display: flex;
        flex-direction: column;
        overflow: hidden;
        min-width: 160px;
      }

      .preview-tab .tab-dot {
        background: #3ecf6e;
        box-shadow: 0 0 6px rgba(62, 207, 110, 0.55);
        animation: live-pulse 2.8s ease-in-out infinite;
      }
      @keyframes live-pulse {
        0%,
        100% {
          opacity: 1;
        }
        50% {
          opacity: 0.5;
        }
      }
      .preview-tab-right {
        margin-left: auto;
        display: flex;
        gap: 2px;
        align-items: center;
      }

      /* iframe wrapper — needed for the drag shield overlay */
      #frame-wrap {
        flex: 1;
        position: relative;
        min-height: 0;
        overflow: hidden;
      }
      #preview-frame {
        width: 100%;
        height: 100%;
        border: none;
        display: block;
      }
      #drag-shield {
        display: none;
        position: absolute;
        inset: 0;
        z-index: 50;
        cursor: inherit;
      }
      #drag-shield.active {
        display: block;
      }

      #paused {
        position: absolute;
        inset: 0;
        z-index: 40;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 10px;
        padding: 24px;
        text-align: center;
        background: var(--bg-0);
      }
      #paused[hidden] {
        display: none;
      }
      #paused p {
        max-width: 300px;
        line-height: 1.5;
        color: var(--muted);
      }

      /* ─── Console ─────────────────────────────────────────────── */
      #console-resize {
        display: none;
      }

      #console-pane {
        flex-shrink: 0;
        height: 190px;
        display: none;
        flex-direction: column;
        border-top: 1px solid var(--border);
        overflow: hidden;
      }
      #console-pane.visible,
      #console-resize.visible {
        display: flex;
      }

      .console-tab .tab-dot {
        background: var(--cyan);
      }
      .console-tab-right {
        margin-left: auto;
        display: flex;
        align-items: center;
        gap: 8px;
      }

      .console-count {
        font-size: 10px;
        background: var(--bg-3);
        color: var(--muted);
        border-radius: 10px;
        padding: 1px 7px;
        min-width: 20px;
        text-align: center;
        display: none;
      }
      .console-count.visible {
        display: inline-block;
      }

      #console-output {
        flex: 1;
        overflow-y: auto;
        font-family:
          "SF Mono", "Cascadia Code", "Fira Code", Consolas, monospace;
        font-size: 11.5px;
        padding: 4px 0;
      }

      .c-entry {
        display: flex;
        align-items: flex-start;
        padding: 2px 0;
        line-height: 1.5;
        border-bottom: 1px solid transparent;
      }
      .c-entry:hover {
        background: rgba(255, 255, 255, 0.025);
      }
      .c-entry.log {
        color: var(--text);
      }
      .c-entry.warn {
        color: var(--yellow);
        background: rgba(229, 192, 123, 0.05);
        border-color: rgba(229, 192, 123, 0.1);
      }
      .c-entry.error {
        color: var(--red);
        background: rgba(224, 108, 117, 0.05);
        border-color: rgba(224, 108, 117, 0.1);
      }
      .c-entry.info {
        color: var(--blue);
      }
      .c-entry.debug {
        color: var(--muted);
      }

      .c-gutter {
        width: 32px;
        flex-shrink: 0;
        text-align: center;
        padding-top: 1px;
        font-size: 10px;
        opacity: 0.5;
      }
      .c-entry.log .c-gutter::before,
      .c-entry.debug .c-gutter::before {
        content: "›";
      }
      .c-entry.warn .c-gutter::before {
        content: "⚠";
      }
      .c-entry.error .c-gutter::before {
        content: "✕";
      }
      .c-entry.info .c-gutter::before {
        content: "i";
        font-style: italic;
      }

      .c-msg {
        flex: 1;
        min-width: 0;
        overflow-x: auto;
        padding-right: 12px;
        white-space: pre-wrap;
        word-break: break-all;
      }

      .c-table {
        border-collapse: collapse;
        margin: 2px 0;
      }
      .c-table th,
      .c-table td {
        padding: 1px 8px;
        border: 1px solid var(--border);
        text-align: left;
        white-space: pre;
      }
      .c-table th {
        color: var(--muted);
        font-weight: 600;
      }

      /* ─── Toast ───────────────────────────────────────────────── */
      #toast {
        position: fixed;
        bottom: 20px;
        left: 50%;
        transform: translateX(-50%) translateY(80px);
        background: var(--bg-2);
        border: 1px solid var(--border);
        color: var(--text);
        padding: 9px 16px;
        border-radius: 8px;
        font-size: 12px;
        font-weight: 500;
        transition: transform 0.28s cubic-bezier(0.34, 1.56, 0.64, 1);
        z-index: 999;
        pointer-events: none;
        white-space: nowrap;
        display: flex;
        align-items: center;
        gap: 8px;
        box-shadow: 0 8px 24px rgba(0, 0, 0, 0.45);
      }
      #toast.show {
        transform: translateX(-50%) translateY(0);
      }
      #toast.copy .toast-icon::before {
        content: "";
        display: inline-block;
        width: 13px;
        height: 13px;
        background-color: var(--accent-hi);
        -webkit-mask-image: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'><path fill='black' d='M7.775 3.275a.75.75 0 001.06 1.06l1.25-1.25a2 2 0 112.83 2.83l-2.5 2.5a2 2 0 01-2.83 0 .75.75 0 00-1.06 1.06 3.5 3.5 0 004.95 0l2.5-2.5a3.5 3.5 0 00-4.95-4.95l-1.25 1.25zm-4.69 9.64a2 2 0 010-2.83l2.5-2.5a2 2 0 012.83 0 .75.75 0 001.06-1.06 3.5 3.5 0 00-4.95 0l-2.5 2.5a3.5 3.5 0 004.95 4.95l1.25-1.25a.75.75 0 00-1.06-1.06l-1.25 1.25a2 2 0 01-2.83 0z'/></svg>");
        mask-image: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'><path fill='black' d='M7.775 3.275a.75.75 0 001.06 1.06l1.25-1.25a2 2 0 112.83 2.83l-2.5 2.5a2 2 0 01-2.83 0 .75.75 0 00-1.06 1.06 3.5 3.5 0 004.95 0l2.5-2.5a3.5 3.5 0 00-4.95-4.95l-1.25 1.25zm-4.69 9.64a2 2 0 010-2.83l2.5-2.5a2 2 0 012.83 0 .75.75 0 001.06-1.06 3.5 3.5 0 00-4.95 0l-2.5 2.5a3.5 3.5 0 004.95 4.95l1.25-1.25a.75.75 0 00-1.06-1.06l-1.25 1.25a2 2 0 01-2.83 0z'/></svg>");
        -webkit-mask-size: contain;
        mask-size: contain;
        -webkit-mask-repeat: no-repeat;
        mask-repeat: no-repeat;
      }

      /* ─── Share link fallback ─────────────────────────────────── */
      #share-pop {
        inset: 52px 14px auto auto;
        width: min(420px, calc(100vw - 28px));
        margin: 0;
        padding: 12px;
        color: var(--text);
        background: var(--bg-2);
        border: 1px solid var(--border);
        border-radius: 8px;
        box-shadow: 0 8px 24px rgba(0, 0, 0, 0.45);
      }
      #share-pop label {
        display: block;
        margin-bottom: 6px;
        font-size: 12px;
        color: var(--muted);
      }
      #share-url {
        width: 100%;
        padding: 6px 8px;
        font-family:
          "SF Mono", "Cascadia Code", "Fira Code", Consolas, monospace;
        font-size: 12px;
        color: var(--text);
        background: var(--bg-0);
        border: 1px solid var(--border);
        border-radius: 6px;
        outline: none;
      }
      #share-url:focus {
        border-color: var(--accent);
      }

      /* ─── Scrollbars ──────────────────────────────────────────── */
      ::-webkit-scrollbar {
        width: 5px;
        height: 5px;
      }
      ::-webkit-scrollbar-track {
        background: transparent;
      }
      ::-webkit-scrollbar-thumb {
        background: #383c40;
        border-radius: 3px;
      }
      ::-webkit-scrollbar-thumb:hover {
        background: #4a4f54;
      }

      /* ─── No-select during drag ───────────────────────────────── */
      body.dragging {
        user-select: none;
        cursor: col-resize;
      }
      body.dragging-h {
        user-select: none;
        cursor: row-resize;
      }
    </style>
  </head>
  <body>
    <!-- Header -->
    <div id="header">
      <div class="logo">
        <span class="logo-mark">
          <svg
            width="20"
            height="20"
            viewBox="0 0 32 32"
            fill="none"
            xmlns="http://www.w3.org/2000/svg"
          >
            <path
              d="M10 6L3 16L10 26L22 6L29 16L22 26"
              stroke="#7e9cb5"
              stroke-width="2.8"
              stroke-linecap="round"
              stroke-linejoin="round"
            />
          </svg>
        </span>
        <span class="logo-text">Sandbox</span>
      </div>
      <div class="header-right">
        <button class="btn btn-primary" id="btn-share">
          <svg width="13" height="13" viewBox="0 0 16 16" fill="currentColor">
            <path
              d="M7.775 3.275a.75.75 0 001.06 1.06l1.25-1.25a2 2 0 112.83 2.83l-2.5 2.5a2 2 0 01-2.83 0 .75.75 0 00-1.06 1.06 3.5 3.5 0 004.95 0l2.5-2.5a3.5 3.5 0 00-4.95-4.95l-1.25 1.25zm-4.69 9.64a2 2 0 010-2.83l2.5-2.5a2 2 0 012.83 0 .75.75 0 001.06-1.06 3.5 3.5 0 00-4.95 0l-2.5 2.5a3.5 3.5 0 004.95 4.95l1.25-1.25a.75.75 0 00-1.06-1.06l-1.25 1.25a2 2 0 01-2.83 0z"
            />
          </svg>
          Share
        </button>
        <a
          class="btn btn-ghost"
          href="https://github.com/tcboni/sandbox"
          target="_blank"
          rel="noopener noreferrer"
          aria-label="Open GitHub repository"
          title="Open GitHub repository"
        >
          <svg
            width="20"
            height="20"
            viewBox="0 0 24 24"
            xmlns="http://www.w3.org/2000/svg"
          >
            <path
              fill="currentColor"
              d="M12 2C6.477 2 2 6.477 2 12c0 4.42 2.865 8.17 6.839 9.49.5.092.682-.217.682-.482 0-.237-.008-.866-.013-1.7-2.782.603-3.369-1.34-3.369-1.34-.454-1.156-1.11-1.463-1.11-1.463-.908-.62.069-.608.069-.608 1.003.07 1.531 1.03 1.531 1.03.892 1.529 2.341 1.088 2.91.832.092-.647.35-1.088.636-1.338-2.22-.253-4.555-1.11-4.555-4.943 0-1.091.39-1.984 1.029-2.683-.103-.253-.446-1.27.098-2.647 0 0 .84-.269 2.75 1.025A9.578 9.578 0 0112 6.836c.85.004 1.705.114 2.504.336 1.909-1.294 2.747-1.025 2.747-1.025.546 1.377.203 2.394.1 2.647.64.699 1.028 1.592 1.028 2.683 0 3.842-2.339 4.687-4.566 4.935.359.309.678.919.678 1.852 0 1.336-.012 2.415-.012 2.743 0 .267.18.578.688.48C19.138 20.167 22 16.418 22 12c0-5.523-4.477-10-10-10z"
            ></path>
          </svg>
        </a>
      </div>
    </div>

    <!-- Main -->
    <div id="main">
      <!-- Editors -->
      <div id="editors-pane">
        <div class="editor-panel" id="html-panel">
          <div class="editor-tab">
            <span class="tab-dot"></span>
            <span class="tab-label">HTML</span>
          </div>
          <div class="editor-wrap">
            <code
              id="html-ed"
              class="code-editor hljs language-xml"
              contenteditable="true"
              spellcheck="false"
            ></code>
          </div>
        </div>

        <div class="rh rh-h" id="rh1"></div>

        <div class="editor-panel" id="css-panel">
          <div class="editor-tab">
            <span class="tab-dot"></span>
            <span class="tab-label">CSS</span>
          </div>
          <div class="editor-wrap">
            <code
              id="css-ed"
              class="code-editor hljs language-css"
              contenteditable="true"
              spellcheck="false"
            ></code>
          </div>
        </div>

        <div class="rh rh-h" id="rh2"></div>

        <div class="editor-panel" id="js-panel">
          <div class="editor-tab">
            <span class="tab-dot"></span>
            <span class="tab-label">JavaScript</span>
          </div>
          <div class="editor-wrap">
            <code
              id="js-ed"
              class="code-editor hljs language-javascript"
              contenteditable="true"
              spellcheck="false"
            ></code>
          </div>
        </div>
      </div>

      <!-- Vertical splitter -->
      <div class="rh rh-v" id="rv"></div>

      <!-- Preview + Console -->
      <div id="preview-pane">
        <div class="preview-tab">
          <span class="tab-dot"></span>
          <span class="tab-label">Preview</span>
          <div class="preview-tab-right">
            <!-- Console toggle: icon only -->
            <button
              class="btn btn-ghost"
              id="btn-console"
              title="Toggle console"
            >
              <svg
                width="13"
                height="13"
                viewBox="0 0 16 16"
                fill="currentColor"
              >
                <path
                  d="M0 2.75C0 1.784.784 1 1.75 1h12.5c.966 0 1.75.784 1.75 1.75v10.5A1.75 1.75 0 0114.25 15H1.75A1.75 1.75 0 010 13.25V2.75zm1.75-.25a.25.25 0 00-.25.25v10.5c0 .138.112.25.25.25h12.5a.25.25 0 00.25-.25V2.75a.25.25 0 00-.25-.25H1.75zm5 8a.75.75 0 010 1.5h-2.5a.75.75 0 010-1.5h2.5zm3.854-3.396a.75.75 0 010 1.06l-1.75 1.75a.75.75 0 01-1.06-1.06l1.22-1.22-1.22-1.22a.75.75 0 011.06-1.06l1.75 1.75z"
                />
              </svg>
            </button>
            <button
              class="btn btn-ghost"
              id="btn-refresh"
              title="Refresh preview"
            >
              <svg
                width="12"
                height="12"
                viewBox="0 0 16 16"
                fill="currentColor"
              >
                <path
                  fill-rule="evenodd"
                  d="M8 3a5 5 0 104.546 2.914.5.5 0 00-.908-.417A4 4 0 118 4V3z"
                />
                <path
                  d="M8 4.466V.534a.25.25 0 01.41-.192l2.36 1.966c.12.1.12.284 0 .384L8.41 4.658A.25.25 0 018 4.466z"
                />
              </svg>
            </button>
          </div>
        </div>

        <div id="frame-wrap">
          <iframe
            id="preview-frame"
            sandbox="allow-scripts allow-modals allow-forms"
          ></iframe>
          <div id="paused" hidden>
            <strong>Auto-run paused</strong>
            <p>
              The last run did not finish. Your code may have an infinite loop.
              Fix it, then click Run.
            </p>
            <button class="btn btn-primary" id="btn-run">Run</button>
          </div>
          <div id="drag-shield"></div>
        </div>

        <div class="rh rh-h" id="console-resize"></div>

        <div id="console-pane">
          <div class="console-tab">
            <span class="tab-dot"></span>
            <span class="tab-label">Console</span>
            <div class="console-tab-right">
              <span class="console-count" id="console-count">0</span>
              <button class="btn btn-ghost" id="btn-clear">Clear</button>
            </div>
          </div>
          <div id="console-output"></div>
        </div>
      </div>
    </div>

    <div id="toast">
      <span class="toast-icon"></span><span id="toast-msg"></span>
    </div>

    <div id="share-pop" popover>
      <label for="share-url">Copy this link</label>
      <input id="share-url" readonly spellcheck="false" />
    </div>

    <script>
      "use strict";

      /* ── Elements ──────────────────────────────────────────────────── */
      const frame = document.getElementById("preview-frame");
      const previewPane = document.getElementById("preview-pane");
      const pausedEl = document.getElementById("paused");
      const consolePn = document.getElementById("console-pane");
      const consoleRes = document.getElementById("console-resize");
      const consoleOut = document.getElementById("console-output");
      const consoleCount = document.getElementById("console-count");
      const editorsPane = document.getElementById("editors-pane");
      const mainArea = document.getElementById("main");
      const htmlPanel = document.getElementById("html-panel");
      const cssPanel = document.getElementById("css-panel");
      const jsPanel = document.getElementById("js-panel");
      const dragShield = document.getElementById("drag-shield");
      const toastEl = document.getElementById("toast");
      const toastMsg = document.getElementById("toast-msg");
      const btnConsole = document.getElementById("btn-console");
      const btnShare = document.getElementById("btn-share");
      const sharePop = document.getElementById("share-pop");
      const shareUrlInput = document.getElementById("share-url");

      /* ── Editors ────────────────────────────────────────── */
      const htmlEd = document.getElementById("html-ed");
      const cssEd = document.getElementById("css-ed");
      const jsEd = document.getElementById("js-ed");

      function escapeHtml(value) {
        return value
          .replaceAll("&", "&amp;")
          .replaceAll("<", "&lt;")
          .replaceAll(">", "&gt;");
      }

      function getEditorValue(editor) {
        return editor.textContent || "";
      }

      function setEditorValue(editor, value) {
        editor.textContent = value || "";
      }

      function getCaretOffset(editor) {
        const sel = window.getSelection();
        if (!sel || sel.rangeCount === 0) return 0;
        const range = sel.getRangeAt(0);
        if (!editor.contains(range.startContainer)) return 0;
        const pre = range.cloneRange();
        pre.selectNodeContents(editor);
        pre.setEnd(range.startContainer, range.startOffset);
        return pre.toString().length;
      }

      function setCaretOffset(editor, offset) {
        const sel = window.getSelection();
        if (!sel) return;
        const range = document.createRange();
        let current = 0;
        const walker = document.createTreeWalker(editor, NodeFilter.SHOW_TEXT);
        let node = walker.nextNode();
        while (node) {
          const next = current + node.nodeValue.length;
          if (offset <= next) {
            range.setStart(node, Math.max(0, offset - current));
            range.collapse(true);
            sel.removeAllRanges();
            sel.addRange(range);
            return;
          }
          current = next;
          node = walker.nextNode();
        }
        range.selectNodeContents(editor);
        range.collapse(false);
        sel.removeAllRanges();
        sel.addRange(range);
      }

      function renderHighlightedEditor(editor, language) {
        const source = getEditorValue(editor);
        const caret = getCaretOffset(editor);
        if (window.hljs) {
          editor.innerHTML = hljs.highlight(source, { language }).value;
        } else {
          editor.innerHTML = escapeHtml(source);
        }
        setCaretOffset(editor, caret);
      }

      function insertAtCaret(text) {
        const sel = window.getSelection();
        if (!sel || sel.rangeCount === 0) return;
        const range = sel.getRangeAt(0);
        range.deleteContents();
        const textNode = document.createTextNode(text);
        range.insertNode(textNode);
        range.setStartAfter(textNode);
        range.collapse(true);
        sel.removeAllRanges();
        sel.addRange(range);
      }

      const editorHistories = new WeakMap();
      const HISTORY_COALESCE_MS = 400;
      const HISTORY_LIMIT = 200;

      function initEditorHistory(editor) {
        editorHistories.set(editor, {
          undo: [],
          redo: [],
          lastPush: 0,
          suspended: false,
        });
      }

      function snapshotEditor(editor) {
        return { text: getEditorValue(editor), caret: getCaretOffset(editor) };
      }

      function recordHistory(editor) {
        const h = editorHistories.get(editor);
        if (!h || h.suspended) return;
        const now = Date.now();
        if (now - h.lastPush > HISTORY_COALESCE_MS || h.undo.length === 0) {
          h.undo.push(snapshotEditor(editor));
          if (h.undo.length > HISTORY_LIMIT) h.undo.shift();
        }
        h.lastPush = now;
        h.redo = [];
      }

      function applySnapshot(editor, snap, language) {
        setEditorValue(editor, snap.text);
        renderHighlightedEditor(editor, language);
        setCaretOffset(editor, snap.caret);
      }

      function undoEditor(editor, language) {
        const h = editorHistories.get(editor);
        if (!h || h.undo.length === 0) return;
        const current = snapshotEditor(editor);
        const prev = h.undo.pop();
        h.redo.push(current);
        h.lastPush = 0;
        h.suspended = true;
        applySnapshot(editor, prev, language);
        h.suspended = false;
        scheduleRun();
        scheduleSave();
      }

      function redoEditor(editor, language) {
        const h = editorHistories.get(editor);
        if (!h || h.redo.length === 0) return;
        const current = snapshotEditor(editor);
        const next = h.redo.pop();
        h.undo.push(current);
        h.lastPush = 0;
        h.suspended = true;
        applySnapshot(editor, next, language);
        h.suspended = false;
        scheduleRun();
        scheduleSave();
      }

      function bindEditorBehavior(editor, language) {
        initEditorHistory(editor);

        editor.addEventListener("beforeinput", () => {
          recordHistory(editor);
        });

        editor.addEventListener("input", () => {
          renderHighlightedEditor(editor, language);
          scheduleRun();
          scheduleSave();
        });

        editor.addEventListener("paste", (e) => {
          e.preventDefault();
          const text = e.clipboardData?.getData("text/plain") || "";
          recordHistory(editor);
          insertAtCaret(text);
          renderHighlightedEditor(editor, language);
          scheduleRun();
          scheduleSave();
        });

        editor.addEventListener("keydown", (e) => {
          const mod = e.metaKey || e.ctrlKey;
          if (mod && e.key.toLowerCase() === "z") {
            e.preventDefault();
            if (e.shiftKey) redoEditor(editor, language);
            else undoEditor(editor, language);
            return;
          }
          if (mod && e.key.toLowerCase() === "y") {
            e.preventDefault();
            redoEditor(editor, language);
            return;
          }
          if (e.key !== "Tab") return;
          e.preventDefault();
          recordHistory(editor);
          insertAtCaret("  ");
          renderHighlightedEditor(editor, language);
          scheduleRun();
          scheduleSave();
        });
      }

      function refreshEditors() {
        renderHighlightedEditor(htmlEd, "xml");
        renderHighlightedEditor(cssEd, "css");
        renderHighlightedEditor(jsEd, "javascript");
      }

      /* ── State ─────────────────────────────────────────────────────── */
      let throttleTimer = null;
      let lastRunAt = 0;
      let runId = 0;
      let autoRunPaused = false;
      let htmlLines = null;
      let saveTimer = null;
      let logCount = 0;
      let consoleOpen = false;
      let appState = {
        code: { h: null, c: null, j: null },
        dimensions: {
          editorsW: "",
          htmlH: "",
          cssH: "",
          jsH: "",
          consoleH: "",
        },
        console: { open: false },
      };

      /* ── LocalStorage ──────────────────────────────────────────────── */
      function saveState() {
        localStorage.setItem("sandbox-state", JSON.stringify(appState));
      }

      function loadState() {
        const saved = localStorage.getItem("sandbox-state");
        if (saved) {
          try {
            const s = JSON.parse(saved);
            if (s.code) appState.code = { ...appState.code, ...s.code };
            if (s.dimensions)
              appState.dimensions = { ...appState.dimensions, ...s.dimensions };
            if (s.console)
              appState.console = { ...appState.console, ...s.console };
          } catch (e) {}
        }
      }

      const MIN_EDITOR_PANEL_PX = 50;
      const DEFAULT_CONSOLE_HEIGHT_PX = 190;
      const MIN_CONSOLE_HEIGHT_PX = 60;
      const SAVE_DELAY_MS = 500;
      const RUN_FLAG_KEY = "sandbox-run-pending";
      const editorPanels = [htmlPanel, cssPanel, jsPanel];

      function normalizeConsoleHeight(value) {
        const n = parseFloat(value);
        if (!Number.isFinite(n) || n < MIN_CONSOLE_HEIGHT_PX) {
          return DEFAULT_CONSOLE_HEIGHT_PX + "px";
        }
        return n + "px";
      }

      function setPanelHeights(heights) {
        editorPanels.forEach((panel, i) => {
          panel.style.flexGrow = heights[i];
        });
      }

      function normalizeEditorWidth(value) {
        if (!value) return "40%";
        if (value.endsWith("%")) return value;
        if (value.endsWith("px")) {
          return (
            ((parseFloat(value) / mainArea.offsetWidth) * 100).toFixed(3) + "%"
          );
        }
        return value;
      }

      function saveCode() {
        clearTimeout(saveTimer);
        saveTimer = null;
        appState.code = {
          h: getEditorValue(htmlEd),
          c: getEditorValue(cssEd),
          j: getEditorValue(jsEd),
        };
        saveState();
      }

      function scheduleSave() {
        clearTimeout(saveTimer);
        saveTimer = setTimeout(saveCode, SAVE_DELAY_MS);
      }

      function flushSave() {
        if (saveTimer) saveCode();
      }

      function saveDimensions() {
        const widthPct =
          ((editorsPane.offsetWidth / mainArea.offsetWidth) * 100).toFixed(3) +
          "%";
        const heights = editorPanels.map((panel) => panel.offsetHeight);
        const total = heights.reduce((sum, h) => sum + h, 0);
        const toPct = (h) => ((h / total) * 100).toFixed(3) + "%";
        appState.dimensions = {
          editorsW: widthPct,
          htmlH: toPct(heights[0]),
          cssH: toPct(heights[1]),
          jsH: toPct(heights[2]),
          consoleH: normalizeConsoleHeight(
            consolePn.style.height || consolePn.offsetHeight + "px",
          ),
        };
        saveState();
      }

      function saveConsole() {
        appState.console = { open: consoleOpen };
        saveState();
      }

      /* ── Drag shield ───────────────────────────────────────────────── */
      function dragStart(cursorClass) {
        dragShield.classList.add("active");
        document.body.classList.add(cursorClass || "dragging");
      }
      function dragEnd(cursorClass) {
        dragShield.classList.remove("active");
        document.body.classList.remove(cursorClass || "dragging");
        refreshEditors();
      }

      /* ── Toast ─────────────────────────────────────────────────────── */
      let toastTimer;
      function toast(msg, type) {
        clearTimeout(toastTimer);
        toastMsg.textContent = msg;
        toastEl.className = "show " + type;
        toastTimer = setTimeout(function () {
          toastEl.className = "";
        }, 2600);
      }

      /* ── URL state ─────────────────────────────────────────────────── */
      function bytesToBase64Url(bytes) {
        let binary = "";
        for (const byte of bytes) binary += String.fromCharCode(byte);
        return btoa(binary)
          .replace(/\+/g, "-")
          .replace(/\//g, "_")
          .replace(/=+$/, "");
      }

      function base64ToBytes(value) {
        const binary = atob(value.replace(/-/g, "+").replace(/_/g, "/"));
        return Uint8Array.from(binary, (char) => char.charCodeAt(0));
      }

      function pipeBytes(bytes, transform) {
        const stream = new Blob([bytes]).stream().pipeThrough(transform);
        return new Response(stream).arrayBuffer();
      }

      function currentCodeJson() {
        return JSON.stringify({
          h: getEditorValue(htmlEd),
          c: getEditorValue(cssEd),
          j: getEditorValue(jsEd),
        });
      }

      async function encodeShare(json) {
        const packed = await pipeBytes(
          new TextEncoder().encode(json),
          new CompressionStream("deflate-raw"),
        );
        return bytesToBase64Url(new Uint8Array(packed));
      }

      async function decodeShare(hash) {
        const bytes = await pipeBytes(
          base64ToBytes(hash),
          new DecompressionStream("deflate-raw"),
        );
        return JSON.parse(new TextDecoder().decode(bytes));
      }

      async function readSharedCode() {
        const hash = location.hash.slice(1);
        if (!hash) return null;
        try {
          const code = await decodeShare(hash);
          history.replaceState(null, "", location.pathname + location.search);
          return code;
        } catch {
          return null;
        }
      }

      function applyCode(code) {
        if (code.h !== undefined) setEditorValue(htmlEd, code.h);
        if (code.c !== undefined) setEditorValue(cssEd, code.c);
        if (code.j !== undefined) setEditorValue(jsEd, code.j);
      }

      /* ── Run preview ───────────────────────────────────────────────── */
      // Runs inside the preview iframe. run() injects its source text, so it
      // must not use anything from the outer scope.
      function previewShim(runId) {
        // User code can declare globals with these names (e.g. `class Node`).
        const { Array, Date, Error, JSON, Map, Node, Object, RegExp, Set } =
          window;
        const host = window.parent;
        const later = setTimeout;
        const MAX_ITEMS = 100;

        function post(data) {
          data.__pg = runId;
          host.postMessage(data, "*");
        }

        function inspect(value, top) {
          let budget = 1000;
          const seen = [];
          const join = (items, total) =>
            items.join(", ") +
            (total > items.length
              ? ", … " + (total - items.length) + " more"
              : "");
          const fmt = (v, depth) => {
            if (--budget < 0) return "…";
            if (typeof v === "string") return depth ? JSON.stringify(v) : v;
            if (typeof v === "number") {
              return Object.is(v, -0) ? "-0" : String(v);
            }
            if (typeof v === "bigint") return v + "n";
            if (typeof v === "function") {
              return depth ? "ƒ " + (v.name || "anonymous") + "()" : String(v);
            }
            if (v === null || typeof v !== "object") return String(v);
            if (v instanceof Error) return String(v);
            if (v instanceof Date) {
              return isNaN(v) ? "Invalid Date" : v.toISOString();
            }
            if (v instanceof RegExp) return String(v);
            if (v instanceof Node) {
              if (v.nodeType !== 1) return v.nodeName;
              const attrs = Array.from(
                v.attributes,
                (a) => ` ${a.name}="${a.value}"`,
              );
              return "<" + v.localName + attrs.join("") + ">";
            }
            if (seen.includes(v)) return "[Circular]";
            if (depth > 3) return Array.isArray(v) ? "[Array]" : "[Object]";
            seen.push(v);
            try {
              const next = (x) => fmt(x, depth + 1);
              if (Array.isArray(v)) {
                return (
                  "[" + join(v.slice(0, MAX_ITEMS).map(next), v.length) + "]"
                );
              }
              if (v instanceof Map) {
                const entries = Array.from(v)
                  .slice(0, MAX_ITEMS)
                  .map(([k, x]) => next(k) + " => " + next(x));
                return `Map(${v.size}) {` + join(entries, v.size) + "}";
              }
              if (v instanceof Set) {
                const values = Array.from(v).slice(0, MAX_ITEMS).map(next);
                return `Set(${v.size}) {` + join(values, v.size) + "}";
              }
              const keys = Object.keys(v);
              const proto = Object.getPrototypeOf(v);
              const name =
                proto && proto !== Object.prototype
                  ? proto.constructor?.name
                  : "";
              const props = keys
                .slice(0, MAX_ITEMS)
                .map(
                  (k) =>
                    (/^[A-Za-z_$][\w$]*$/.test(k) ? k : JSON.stringify(k)) +
                    ": " +
                    next(v[k]),
                );
              return (
                (name ? name + " " : "") + "{" + join(props, keys.length) + "}"
              );
            } finally {
              seen.pop();
            }
          };
          try {
            return fmt(value, top ? 0 : 1);
          } catch {
            return "[unprintable]";
          }
        }

        function format(args) {
          const parts = [{ text: "", css: "" }];
          const add = (text) => {
            parts[parts.length - 1].text += text;
          };
          let used = 0;
          if (typeof args[0] === "string" && args.length > 1) {
            used = 1;
            args[0].split(/(%[sdifoOc%])/).forEach((token, i) => {
              if (i % 2 === 0) return add(token);
              const type = token[1];
              if (type === "%") return add("%");
              if (used >= args.length) return add(token);
              const arg = args[used++];
              if (type === "c") parts.push({ text: "", css: String(arg) });
              else if (type === "d" || type === "i") {
                add(String(parseInt(arg, 10)));
              } else if (type === "f") add(String(parseFloat(arg)));
              else add(inspect(arg, type === "s"));
            });
          }
          const rest = args.slice(used).map((arg) => inspect(arg, true));
          if (rest.length) {
            parts.push({ text: (used ? " " : "") + rest.join(" "), css: "" });
          }
          return parts.filter((part) => part.text);
        }

        function emit(level, args, prefix) {
          let parts;
          try {
            parts = format(args);
          } catch {
            parts = [{ text: "[unprintable]", css: "" }];
          }
          if (prefix) parts.unshift({ text: prefix, css: "" });
          post({ type: "console", level, parts });
        }

        function tableOf(data, columns) {
          try {
            const isRecord = (x) => x !== null && typeof x === "object";
            const rows = Object.keys(data).slice(0, 1000);
            const keys = [];
            let hasValues = false;
            for (const row of rows) {
              if (!isRecord(data[row])) hasValues = true;
              else {
                for (const key of Object.keys(data[row])) {
                  if (!keys.includes(key)) keys.push(key);
                }
              }
            }
            const shown = Array.isArray(columns) ? columns.map(String) : keys;
            return {
              head: ["(index)", ...shown, ...(hasValues ? ["Value"] : [])],
              rows: rows.map((row) => {
                const item = data[row];
                const cells = shown.map((key) =>
                  isRecord(item) && key in item ? inspect(item[key]) : "",
                );
                if (hasValues) cells.push(isRecord(item) ? "" : inspect(item));
                return [row, ...cells];
              }),
            };
          } catch {
            return null;
          }
        }

        const original = { ...console };
        for (const method of ["log", "info", "warn", "error", "debug", "dir"]) {
          console[method] = (...args) => {
            emit(method === "dir" ? "log" : method, args);
            original[method].apply(console, args);
          };
        }
        console.assert = (ok, ...args) => {
          if (!ok) {
            emit(
              "error",
              args,
              args.length ? "Assertion failed: " : "Assertion failed",
            );
          }
          original.assert.call(console, ok, ...args);
        };
        console.clear = () => {
          post({ type: "clear" });
          original.clear.call(console);
        };
        console.table = (...args) => {
          const [data, columns] = args;
          const table =
            data !== null && typeof data === "object" && tableOf(data, columns);
          if (table) post({ type: "table", ...table });
          else emit("log", args.slice(0, 1));
          original.table.apply(console, args);
        };

        addEventListener("error", (e) => {
          const file = String(e.filename || "");
          post({
            type: "error",
            message: e.message,
            line: e.lineno,
            file: file.startsWith("data:") ? "data:" : file,
          });
        });
        addEventListener("unhandledrejection", (e) => {
          post({
            type: "error",
            message: "Unhandled rejection: " + inspect(e.reason, true),
          });
        });
        // Report "done" a moment after load, so loops that start in timers or
        // load handlers also leave the run unfinished.
        addEventListener("load", () =>
          later(() => post({ type: "done" }), 300),
        );
      }

      function run() {
        runId++;
        clearConsole();
        pausedEl.hidden = true;
        localStorage.setItem(RUN_FLAG_KEY, "1");

        const html = getEditorValue(htmlEd);
        const head =
          '<!DOCTYPE html><html><head><meta charset="UTF-8">\n' +
          "<script>(" +
          previewShim +
          ")(" +
          runId +
          ");<\/script>\n" +
          "<style>\n" +
          getEditorValue(cssEd) +
          "\n</style></head><body>\n";
        htmlLines = {
          start: head.split("\n").length,
          count: html.split("\n").length,
        };
        // A data: URL keeps error details in Safari, which hides them for
        // inline scripts in a sandboxed frame. It also stops a closing script
        // tag inside the code from ending the element.
        const jsUrl =
          "data:text/javascript;charset=utf-8," +
          encodeURIComponent(getEditorValue(jsEd));
        frame.srcdoc =
          head +
          html +
          '\n<script src="' +
          jsUrl +
          '"><\/script>\n</body></html>';
      }

      function scheduleRun() {
        if (autoRunPaused) return;
        const now = Date.now();
        const elapsed = now - lastRunAt;
        const wait = 100;

        if (elapsed >= wait) {
          lastRunAt = now;
          run();
          return;
        }

        clearTimeout(throttleTimer);
        throttleTimer = setTimeout(() => {
          lastRunAt = Date.now();
          run();
          throttleTimer = null;
        }, wait - elapsed);
      }

      /* ── Console messages from iframe ──────────────────────────────── */
      const CONSOLE_LIMIT = 1000;
      // Only these %c properties apply, so styles cannot leave the console.
      const CONSOLE_STYLES = [
        "color",
        "background-color",
        "font-weight",
        "font-style",
        "text-decoration",
        "padding",
        "border-radius",
      ];
      const styleReader = document.createElement("span");
      let consoleQueue = [];
      let consoleFlushQueued = false;

      window.addEventListener("message", function (e) {
        const data = e.data;
        if (e.source !== frame.contentWindow || !data || data.__pg !== runId) {
          return;
        }
        if (data.type === "console") {
          appendConsole({ level: data.level, parts: data.parts });
        } else if (data.type === "table") {
          appendConsole({ level: "log", table: data });
        } else if (data.type === "error") {
          const text = data.message + sourceLocation(data.line, data.file);
          appendConsole({ level: "error", parts: [{ text, css: "" }] });
        } else if (data.type === "clear") {
          clearConsole();
        } else if (data.type === "done") {
          localStorage.removeItem(RUN_FLAG_KEY);
          autoRunPaused = false;
        }
      });

      function sourceLocation(line, file) {
        if (!line) return "";
        if (file === "data:") return ` (JS line ${line})`;
        const { start, count } = htmlLines;
        if (file === "about:srcdoc" && line >= start && line < start + count) {
          return ` (HTML line ${line - start + 1})`;
        }
        return "";
      }

      function appendConsole(entry) {
        logCount++;
        consoleQueue.push(entry);
        if (consoleQueue.length > 2 * CONSOLE_LIMIT) {
          consoleQueue = consoleQueue.slice(-CONSOLE_LIMIT);
        }
        if (!consoleFlushQueued) {
          consoleFlushQueued = true;
          requestAnimationFrame(flushConsole);
        }
      }

      function flushConsole() {
        consoleFlushQueued = false;
        const rows = document.createDocumentFragment();
        for (const entry of consoleQueue.slice(-CONSOLE_LIMIT)) {
          rows.appendChild(renderEntry(entry));
        }
        consoleQueue = [];
        consoleOut.appendChild(rows);
        while (consoleOut.childElementCount > CONSOLE_LIMIT) {
          consoleOut.firstElementChild.remove();
        }
        consoleCount.textContent = logCount;
        consoleCount.classList.toggle("visible", logCount > 0);
        consoleOut.scrollTop = consoleOut.scrollHeight;
      }

      function renderEntry(entry) {
        const row = document.createElement("div");
        row.className = "c-entry " + (entry.level || "log");

        const gut = document.createElement("span");
        gut.className = "c-gutter";

        const txt = document.createElement("span");
        txt.className = "c-msg";
        if (entry.table) {
          txt.appendChild(renderTable(entry.table));
        } else {
          for (const part of entry.parts) {
            txt.appendChild(
              part.css ? styledText(part) : document.createTextNode(part.text),
            );
          }
        }

        row.appendChild(gut);
        row.appendChild(txt);
        return row;
      }

      function styledText(part) {
        const span = document.createElement("span");
        span.textContent = part.text;
        styleReader.style.cssText = part.css;
        for (const name of CONSOLE_STYLES) {
          span.style.setProperty(
            name,
            styleReader.style.getPropertyValue(name),
          );
        }
        return span;
      }

      function renderTable(data) {
        const table = document.createElement("table");
        table.className = "c-table";
        for (const cells of [data.head, ...data.rows]) {
          const tr = table.insertRow();
          for (const text of cells) {
            const cell = document.createElement(
              cells === data.head ? "th" : "td",
            );
            cell.textContent = text;
            tr.appendChild(cell);
          }
        }
        return table;
      }

      function clearConsole() {
        consoleOut.innerHTML = "";
        consoleQueue = [];
        logCount = 0;
        consoleCount.textContent = "0";
        consoleCount.classList.remove("visible");
      }

      /* ── Button handlers ───────────────────────────────────────────── */
      document.getElementById("btn-refresh").addEventListener("click", run);
      document.getElementById("btn-run").addEventListener("click", run);

      let shareCache = { json: "", url: "" };

      async function prepareShareUrl() {
        const json = currentCodeJson();
        if (shareCache.json !== json) {
          const hash = await encodeShare(json);
          const url = location.origin + location.pathname + "#" + hash;
          shareCache = { json, url };
        }
        return shareCache.url;
      }

      function showShareLink(url) {
        shareUrlInput.value = url;
        sharePop.showPopover();
        shareUrlInput.focus();
        shareUrlInput.select();
      }

      function shareLink(url) {
        if (navigator.share && matchMedia("(pointer: coarse)").matches) {
          navigator.share({ url }).catch((err) => {
            if (err.name !== "AbortError") showShareLink(url);
          });
        } else if (navigator.clipboard) {
          navigator.clipboard.writeText(url).then(
            () => toast("URL copied to clipboard", "copy"),
            () => showShareLink(url),
          );
        } else {
          showShareLink(url);
        }
      }

      // Build the link before the click, so the click handler can call the
      // clipboard or share API directly. Safari can reject them after an await.
      btnShare.addEventListener("pointerdown", prepareShareUrl);
      btnShare.addEventListener("focus", prepareShareUrl);
      btnShare.addEventListener("click", function () {
        if (shareCache.json === currentCodeJson()) shareLink(shareCache.url);
        else prepareShareUrl().then(shareLink);
      });

      btnConsole.addEventListener("click", toggleConsole);
      document
        .getElementById("btn-clear")
        .addEventListener("click", clearConsole);

      function toggleConsole() {
        consoleOpen = !consoleOpen;
        consolePn.classList.toggle("visible", consoleOpen);
        consoleRes.classList.toggle("visible", consoleOpen);
        btnConsole.classList.toggle("active", consoleOpen);
        saveConsole();
      }

      /* ── Resize ────────────────────────────────────────────────────── */
      function makeSplitter(handle, cursorClass, begin, move) {
        let drag = null;

        handle.addEventListener("mousedown", function (e) {
          drag = { x: e.clientX, y: e.clientY, start: begin() };
          dragStart(cursorClass);
          handle.classList.add("dragging");
          e.preventDefault();
        });

        document.addEventListener("mousemove", function (e) {
          if (drag) move(drag.start, e.clientX - drag.x, e.clientY - drag.y);
        });

        document.addEventListener("mouseup", function () {
          if (!drag) return;
          drag = null;
          dragEnd(cursorClass);
          handle.classList.remove("dragging");
          saveDimensions();
        });
      }

      // Moves the boundary below panel i. The nearest panel gives up space
      // first; a panel at its minimum passes the rest to the next one.
      function moveBoundary(heights, i, delta) {
        const next = heights.slice();
        const step = delta > 0 ? 1 : -1;
        let wanted = Math.abs(delta);
        let moved = 0;
        let k = delta > 0 ? i + 1 : i;
        while (wanted > 0 && k >= 0 && k < next.length) {
          const take = Math.min(
            wanted,
            Math.max(0, next[k] - MIN_EDITOR_PANEL_PX),
          );
          next[k] -= take;
          wanted -= take;
          moved += take;
          k += step;
        }
        next[delta > 0 ? i : i + 1] += moved;
        return next;
      }

      makeSplitter(
        document.getElementById("rv"),
        "dragging",
        () => editorsPane.offsetWidth,
        (startW, dx) => {
          const mainW = mainArea.offsetWidth;
          const newW = Math.max(160, Math.min(startW + dx, mainW - 164));
          editorsPane.style.width = ((newW / mainW) * 100).toFixed(3) + "%";
        },
      );

      ["rh1", "rh2"].forEach((id, i) => {
        makeSplitter(
          document.getElementById(id),
          "dragging-h",
          () => editorPanels.map((panel) => panel.offsetHeight),
          (startHeights, dx, dy) => {
            setPanelHeights(moveBoundary(startHeights, i, dy));
          },
        );
      });

      makeSplitter(
        consoleRes,
        "dragging-h",
        () => consolePn.offsetHeight,
        (startH, dx, dy) => {
          const maxH = previewPane.offsetHeight - 80;
          consolePn.style.height =
            Math.max(MIN_CONSOLE_HEIGHT_PX, Math.min(startH - dy, maxH)) + "px";
        },
      );

      /* ── Default content ───────────────────────────────────────────── */
      const DEFAULT_HTML = `<div class="card">
  <h1>Hey there! 👋</h1>
  <p>Edit HTML, CSS, and JavaScript in the panels on the left. Changes run automatically.</p>
  <div class="actions">
    <button onclick="sayHello()">Say Hello</button>
  </div>
</div>`;

      const DEFAULT_CSS = `* { box-sizing: border-box; margin: 0; padding: 0; }

body {
  min-height: 100vh;
  display: flex;
  align-items: center;
  justify-content: center;
  background: #0e0f10;
  font-family: system-ui, sans-serif;
  padding: 20px;
  color: #d5d9dd;
}

.card {
  background: #1c1f21;
  border: 1px solid #2e3236;
  border-radius: 14px;
  padding: 40px 48px;
  text-align: center;
  max-width: 420px;
  width: 100%;
}

h1 {
  font-size: 28px;
  font-weight: 700;
  color: #e8ebee;
  margin-bottom: 12px;
  letter-spacing: -.5px;
}

p {
  color: #848a91;
  line-height: 1.6;
  margin-bottom: 28px;
  font-size: 14px;
}

.actions { display: flex; gap: 10px; justify-content: center; flex-wrap: wrap; }

button {
  padding: 10px 22px;
  border-radius: 8px;
  font-size: 14px;
  font-weight: 500;
  cursor: pointer;
  border: none;
  background: #7e9cb5;
  color: #10161b;
  transition: transform .1s, opacity .1s;
}
button:hover { opacity: .88; transform: translateY(-1px); }
button:active { transform: translateY(0); }`;

      const DEFAULT_JS = `function sayHello() {
  const greetings = ['Hello! 👋', 'Hey there! ✨', 'Hi! 🚀', 'Howdy! 🤠'];
  const msg = greetings[Math.floor(Math.random() * greetings.length)];
  console.log('Button clicked:', msg);
  alert(msg);
}`;

      /* ── Init ──────────────────────────────────────────────────────── */
      loadState();

      editorsPane.style.width = normalizeEditorWidth(
        appState.dimensions.editorsW,
      );

      const savedHeights = [
        appState.dimensions.htmlH,
        appState.dimensions.cssH,
        appState.dimensions.jsH,
      ].map(parseFloat);
      if (savedHeights.every((h) => h > 0)) setPanelHeights(savedHeights);

      if (appState.dimensions.consoleH)
        consolePn.style.height = normalizeConsoleHeight(
          appState.dimensions.consoleH,
        );
      else consolePn.style.height = DEFAULT_CONSOLE_HEIGHT_PX + "px";

      if (appState.console.open) {
        consoleOpen = true;
        consolePn.classList.add("visible");
        consoleRes.classList.add("visible");
        btnConsole.classList.add("active");
      }

      window.addEventListener("hashchange", async function () {
        const shared = await readSharedCode();
        if (!shared) return;
        applyCode(shared);
        // The old undo steps belong to the replaced code.
        [htmlEd, cssEd, jsEd].forEach(initEditorHistory);
        refreshEditors();
        scheduleRun();
      });

      window.addEventListener("pagehide", flushSave);
      document.addEventListener("visibilitychange", function () {
        if (document.hidden) flushSave();
      });

      readSharedCode().then(function (shared) {
        // Load code from stored state only when there is no URL state
        applyCode(
          shared || {
            h: appState.code.h != null ? appState.code.h : DEFAULT_HTML,
            c: appState.code.c != null ? appState.code.c : DEFAULT_CSS,
            j: appState.code.j != null ? appState.code.j : DEFAULT_JS,
          },
        );

        // Attach change listeners after initial content is set (avoids spurious run)
        bindEditorBehavior(htmlEd, "xml");
        bindEditorBehavior(cssEd, "css");
        bindEditorBehavior(jsEd, "javascript");

        refreshEditors();
        // A run that never reported "done" probably hung: do not repeat it.
        if (localStorage.getItem(RUN_FLAG_KEY)) {
          autoRunPaused = true;
          pausedEl.hidden = false;
        } else {
          run();
        }
      });
    </script>
    <!-- Loads after the app: the editors show plain text until it is ready. -->
    <script type="module">
      import hljs from "highlight.js/core.min.js";
      import xml from "highlight.js/languages/xml.min.js";
      import css from "highlight.js/languages/css.min.js";
      import javascript from "highlight.js/languages/javascript.min.js";

      hljs.registerLanguage("xml", xml);
      hljs.registerLanguage("css", css);
      hljs.registerLanguage("javascript", javascript);
      window.hljs = hljs;
      refreshEditors();
    </script>
  </body>
</html>
